<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="white"/>
  
  <!-- Main gourd resonator (tumba) -->
  <ellipse cx="256" cy="400" rx="100" ry="85" fill="#D4A056" stroke="#8B6914" stroke-width="3"/>
  
  <!-- Gourd shading -->
  <ellipse cx="240" cy="390" rx="70" ry="55" fill="#C49040" opacity="0.5"/>
  <ellipse cx="256" cy="400" rx="85" ry="72" fill="none" stroke="#B8863A" stroke-width="1.5"/>
  
  <!-- Sound hole (rosette) on gourd -->
  <circle cx="256" cy="400" r="25" fill="#1a1a1a" stroke="#8B6914" stroke-width="2"/>
  <circle cx="256" cy="400" r="18" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <circle cx="256" cy="400" r="11" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  
  <!-- Bridge (jawari) -->
  <rect x="238" y="365" width="36" height="6" rx="2" fill="#5C3A1E" stroke="#3a1f0a" stroke-width="1"/>
  
  <!-- Neck -->
  <rect x="247" y="80" width="18" height="290" rx="4" fill="#B8863A" stroke="#8B6914" stroke-width="2"/>
  
  <!-- Neck shading -->
  <rect x="247" y="80" width="8" height="290" fill="#D4A056" opacity="0.4"/>
  
  <!-- Frets (thin horizontal lines on neck) -->
  <line x1="245" y1="140" x2="267" y2="140" stroke="#5C3A1E" stroke-width="1.5"/>
  <line x1="245" y1="170" x2="267" y2="170" stroke="#5C3A1E" stroke-width="1.5"/>
  <line x1="245" y1="200" x2="267" y2="200" stroke="#5C3A1E" stroke-width="1.5"/>
  <line x1="245" y1="230" x2="267" y2="230" stroke="#5C3A1E" stroke-width="1.5"/>
  <line x1="245" y1="260" x2="267" y2="260" stroke="#5C3A1E" stroke-width="1.5"/>
  <line x1="245" y1="290" x2="267" y2="290" stroke="#5C3A1E" stroke-width="1.5"/>
  <line x1="245" y1="320" x2="267" y2="320" stroke="#5C3A1E" stroke-width="1.5"/>
  
  <!-- Upper gourd (secondary resonator) -->
  <ellipse cx="256" cy="80" rx="30" ry="22" fill="#D4A056" stroke="#8B6914" stroke-width="2.5"/>
  <ellipse cx="250" cy="76" rx="20" ry="14" fill="#C49040" opacity="0.4"/>
  
  <!-- Tuning pegs -->
  <rect x="210" y="95" width="8" height="4" rx="1" fill="#5C3A1E"/>
  <rect x="210" y="115" width="8" height="4" rx="1" fill="#5C3A1E"/>
  <rect x="210" y="135" width="8" height="4" rx="1" fill="#5C3A1E"/>
  <rect x="210" y="155" width="8" height="4" rx="1" fill="#5C3A1E"/>
  
  <!-- Peg handles -->
  <rect x="206" y="93" width="6" height="8" rx="2" fill="#8B6914"/>
  <rect x="206" y="113" width="6" height="8" rx="2" fill="#8B6914"/>
  <rect x="206" y="133" width="6" height="8" rx="2" fill="#8B6914"/>
  <rect x="206" y="153" width="6" height="8" rx="2" fill="#8B6914"/>
  
  <!-- Strings (4 strings running from pegs to bridge, then anchor pins) -->
  <line x1="253" y1="97" x2="253" y2="365" stroke="#E8D8A0" stroke-width="0.8" opacity="0.9"/>
  <line x1="255" y1="117" x2="255" y2="365" stroke="#E8D8A0" stroke-width="0.8" opacity="0.9"/>
  <line x1="257" y1="137" x2="257" y2="365" stroke="#E8D8A0" stroke-width="0.8" opacity="0.9"/>
  <line x1="259" y1="157" x2="259" y2="365" stroke="#E8D8A0" stroke-width="0.8" opacity="0.9"/>
  
  <!-- Anchor pins below bridge -->
  <circle cx="253" cy="440" r="2.5" fill="#C0A060"/>
  <circle cx="257" cy="444" r="2.5" fill="#C0A060"/>
  <circle cx="261" cy="440" r="2.5" fill="#C0A060"/>
  <circle cx="265" cy="444" r="2.5" fill="#C0A060"/>
  
  <!-- String tailpiece (beyond bridge to anchors) -->
  <line x1="253" y1="365" x2="253" y2="440" stroke="#E8D8A0" stroke-width="0.5" opacity="0.5"/>
  <line x1="255" y1="365" x2="257" y2="444" stroke="#E8D8A0" stroke-width="0.5" opacity="0.5"/>
  <line x1="257" y1="365" x2="261" y2="440" stroke="#E8D8A0" stroke-width="0.5" opacity="0.5"/>
  <line x1="259" y1="365" x2="265" y2="444" stroke="#E8D8A0" stroke-width="0.5" opacity="0.5"/>
</svg>
