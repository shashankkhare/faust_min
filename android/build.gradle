// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.example.faust_min"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.example.faust_min"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"

            // The default CMake version for the Android Gradle Plugin is 3.10.2.
            // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
            //
            // The Flutter tooling requires that developers have CMake 3.10 or later
            // installed. You should not increase this version, as doing so will cause
            // the plugin to fail to compile for some customers of the plugin.
            // version "3.10.2"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}

task compileFaustDSPs {
    doLast {
        def dspDir = file("../assets/dsp")
        def srcDir = file("../src")
        
        if (!dspDir.exists()) return

        dspDir.eachFileMatch(~/.*\.dsp/) { dspFile ->
            def name = dspFile.name.replace(".dsp", "")
            def capitalizedName = name.substring(0, 1).toUpperCase() + name.substring(1)
            def hppName = "Faust" + capitalizedName + "DSP.hpp"
            def hppFile = new File(srcDir, hppName)
            
            // Recompile if the HPP file doesn't exist or the DSP file is newer
            if (!hppFile.exists() || dspFile.lastModified() > hppFile.lastModified()) {
                println "Faust: Compiling ${dspFile.name} to ${hppFile.name}..."
                exec {
                    commandLine 'faust', '-lang', 'cpp', '-es', '1', '-single', '-ftz', '0', '-cn', "Faust${capitalizedName}DSP", dspFile.absolutePath, '-o', hppFile.absolutePath
                }
            }
        }
    }
}

preBuild.dependsOn compileFaustDSPs
